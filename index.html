<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniChord Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="synth-container">
    <header class="synth-header">
      <div class="brand">
        <span class="brand-sub">ELECTRONIC CHORD SYSTEM</span>
        <h1>OMNI-SYNTH</h1>
      </div>
      <div class="master-panel">
        <div class="volume-control">
          <label for="master-vol">VOLUME MASTER</label>
          <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.7">
        </div>
        <div class="chord-display">
          ACCORDO: <span id="current-chord">Nessuno</span>
        </div>
      </div>
    </header>

    <main class="synth-body">
      <!-- Matrice Accordi -->
      <section class="chord-matrix-section">
        <h2>MATRICE ACCORDI</h2>
        <div id="chord-matrix" class="matrix-grid"></div>
      </section>

      <!-- Strumplate Metallico -->
      <section class="strumplate-section">
        <div class="strumplate-header">
          <h2>SONIC STRUMPLATE</h2>
          <span class="touch-hint">SCORRI SULLA SUPERFICIE DORATA</span>
        </div>
        <div class="canvas-wrapper">
          <canvas id="strum-canvas"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
